<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MusicNotes - Home</title>
  <link rel="stylesheet" href="/client/home.css">
</head>
<body>
  <div class="top-bar">
    <div class="welcome-area">
      <h1>Welcome to MusicNotes</h1>
      <p id="welcome"></p>
    </div>
    <button class="btn" id="logoutBtn">Log Out</button>
  </div>

  <script>
    // Show who is logged in, or send them back to the login page
    const user = sessionStorage.getItem("username");
    if (!user) {
      window.location.href = "/";
    } else {
      document.getElementById("welcome").textContent = "Logged in as " + user;
    }

    document.getElementById("logoutBtn").addEventListener("click", function () {
      sessionStorage.removeItem("username");
      window.location.href = "/";
    });
  </script>
</body>
</html>
